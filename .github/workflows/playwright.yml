name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # každý všední den v 6:00 UTC
    - cron: '0 6 * * 1-5'
  # Ruční spuštění: GitHub → Actions → Playwright Tests → Run workflow
  workflow_dispatch:
    inputs:
      suite:
        description: 'Které testy spustit'
        type: choice
        options:
          - vse
          - kosik
          - ucet
          - objednavka
        default: vse
      grep:
        description: 'Filtr podle názvu testu (volitelné, např. "registrace")'
        type: string
        required: false
        default: ''
      base_url:
        description: 'Testované prostředí'
        type: string
        required: false
        default: 'https://prestashop.tesena.com/cs/'
      repeat_each:
        description: 'Kolikrát spustit každý test (kontrola stability)'
        type: choice
        options: ['1', '3', '5', '10']
        default: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # u automatických spuštění jsou inputs prázdné → použijí se výchozí hodnoty
      BASE_URL: ${{ inputs.base_url || 'https://prestashop.tesena.com/cs/' }}
      SUITE: ${{ inputs.suite || 'vse' }}
      GREP: ${{ inputs.grep }}
      REPEAT_EACH: ${{ inputs.repeat_each || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          case "$SUITE" in
            kosik)      SPEC="tests/cart.spec.ts" ;;
            ucet)       SPEC="tests/account.spec.ts" ;;
            objednavka) SPEC="tests/checkout.spec.ts" ;;
            *)          SPEC="" ;;
          esac
          ARGS=(--repeat-each="$REPEAT_EACH")
          [ -n "$GREP" ] && ARGS+=(--grep "$GREP")
          echo "Prostředí: $BASE_URL | Sada: $SUITE | Filtr: ${GREP:-žádný} | Opakování: $REPEAT_EACH"
          npx playwright test $SPEC "${ARGS[@]}"

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14
